name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'ecosystem.config.cjs'
      - 'scripts/deploy-api-ec2.sh'
      - '.github/workflows/deploy-api-ec2.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy on EC2
        required: false
        default: main
      run_migrations:
        description: Run database migrations
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-api-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require EC2 deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          missing=0
          if [ -z "$EC2_HOST" ]; then echo "::error::Secret EC2_HOST is missing or empty"; missing=1; fi
          if [ -z "$EC2_USER" ]; then echo "::error::Secret EC2_USER is missing or empty"; missing=1; fi
          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then echo "::error::Secret EC2_SSH_PRIVATE_KEY is missing or empty"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "EC2 deploy secrets are present"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /home/ubuntu/Astalakshimi
            export DEPLOY_BRANCH="${{ github.event.inputs.branch || 'main' }}"
            export RUN_MIGRATIONS="${{ github.event.inputs.run_migrations || 'false' }}"
            bash scripts/deploy-api-ec2.sh

      - name: Verify public health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl -sf -m 10 "http://${{ secrets.EC2_HOST }}/api/health" | grep -q '"database":"healthy"'; then
              echo "Public health check passed"
              exit 0
            fi
            echo "Waiting for public health... ($i/10)"
            sleep 5
          done
          echo "Public health check failed"
          exit 1
